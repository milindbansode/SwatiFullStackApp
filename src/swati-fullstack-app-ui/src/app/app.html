<div class="shell">
  <header class="topbar">
    <div>
      <p class="badge">ASP.NET Core + Angular</p>
      <h1>{{ title }}</h1>
      <p class="summary">A practical learning dashboard covering modern full-stack engineering, Azure, and design patterns.</p>
    </div>

    <nav aria-label="Primary navigation">
      @for (item of navigationItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }">
          {{ item.label }}
        </a>
      }
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
